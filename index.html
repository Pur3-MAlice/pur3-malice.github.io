<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="tailwind.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css"
    />
    <title>Watkins Wedding</title>
  </head>

  <body>
    <header class="header">
      <div class="bottom-bar">
        <div class="bottom-bar-content">
          <span class="logo-text">Watkins Wedding '27</span>
          <nav class="nav">
            <ul class="nav-list">
              <li class="nav-item">
                <a class="nav-link" href="#">Travel & Stay</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Things to Do</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Registry</a>
              </li>
              <li class="nav-item">
                <a class="btn" href="#">RSVP</a>
              </li>
            </ul>
          </nav>
          <div class="hamburger">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
      </div>
    </header>

    <div class="main-body">
      <section class="main-body-intro">
        <div class="banner-intro">
          <h1>A & J</h1>
          <p>WE'RE GETTIN'<br />MARRIED</p>
          <div>
            <p>18.09.2027</p>
            <p>Manchester</p>
          </div>
        </div>
      </section>

      <section class="travelling-section">
        <div class="travelling-svg-01 svg-text">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 800 120"
            preserveAspectRatio="xMidYMid slice"
          >
            <defs>
              <path
                id="path"
                d="M0 60 C300 -20 500 140 800 60"
                stroke="#fff"
                fill="none"
              />
            </defs>
            <text
              fill="#a43a36"
              font-family="Playfair Display, sans-serif"
              font-weight="500"
              font-size="12px"
            >
              <textPath
                class="repeatText"
                id="tp"
                xlink:href="#path"
              ></textPath>
            </text>
          </svg>
          <button id="pauseBtn">
            <i class="fa fa-pause" aria-hidden="true"></i>
          </button>
        </div>
      </section>

      <section class="our-story-section">
        <div>
          <h2>OUR STORY</h2>
          <p>We met and it was nice</p>
        </div>
      </section>
    </div>

    <footer>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
      <script src="script.js"></script>
    </footer>
  </body>
</html>
